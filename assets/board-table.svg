<text x="340.0" y="331.0" text-anchor="middle" font-size="11" fill="#eef2ec">Beta Readers</text></g>
<ellipse cx="340" cy="205" rx="66" ry="28" fill="#172417" stroke="#a9cf9c" stroke-width="1.2"/>
<text x="340" y="209" text-anchor="middle" font-size="12" fill="#a9cf9c">Editor-in-Chief</text>
<text x="112" y="390" font-size="12" font-weight="700" style="font-family:ui-monospace,Menlo,monospace" fill="#a9cf9c">></text>
