<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 420" role="img" aria-labelledby="t d">
<title id="t">The Masthead board table</title><desc id="d">Round table with the Editor-in-Chief in the centre and eleven AI roles on screens around it, shown with sample status.</desc>
<style>
text{font-family:ui-sans-serif,-apple-system,'Segoe UI',sans-serif}
@media (prefers-reduced-motion:no-preference){
.flow{stroke-dasharray:7 9;animation:fl 1.3s linear infinite}
@keyframes fl{to{stroke-dashoffset:-32}}
.bk{animation:b 1.1s steps(2,end) infinite}
@keyframes b{50%{opacity:.2}}
.sway{transform-box:fill-box;transform-origin:50% 0;animation:sway 5.4s ease-in-out infinite}
@keyframes sway{0%,100%{transform:translate(-1.6px,0) rotate(-1.5deg)}30%{transform:translate(1.2px,-.6px) rotate(1deg)}55%{transform:translate(2px,.3px) rotate(1.7deg)}80%{transform:translate(-.6px,.4px) rotate(-.6deg)}}
}
</style>
<rect width="680" height="420" rx="14" fill="#0a0f0b"/>
<text x="340" y="32" text-anchor="middle" font-size="20" style="font-family:Georgia,'Times New Roman',serif" fill="#eef2ec">The Masthead</text>
<text x="340" y="52" text-anchor="middle" font-size="12" fill="#98a595">Your AI editorial board, live</text>
<ellipse cx="340" cy="205" rx="292" ry="140" fill="#101912" stroke="#243024"/>
<ellipse cx="340" cy="205" rx="240" ry="116" fill="#2a241a" stroke="#3a2e1c"/>
