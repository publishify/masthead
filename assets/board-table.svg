<text x="401.42" y="108.13" text-anchor="middle" font-size="14" font-weight="700" style="font-family:ui-monospace,Menlo,monospace" fill="#7fb571">✓</text>
<text x="401.42" y="131.13" text-anchor="middle" font-size="11" fill="#eef2ec">Summarizer</text></g>
<g class="sway" style="animation-duration:4.8s;animation-delay:-1.28s">
