<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 420" role="img" aria-labelledby="t d">
<title id="t">The Masthead board table</title><desc id="d">The Editor-in-Chief script at the centre, three AI readings and four scripts that use no tokens around it, shown with sample status.</desc>
<style>
text{font-family:ui-sans-serif,-apple-system,'Segoe UI',sans-serif}
@media (prefers-reduced-motion:no-preference){
.flow{stroke-dasharray:7 9;animation:fl 1.3s linear infinite}
@keyframes fl{to{stroke-dashoffset:-32}}
.bk{animation:b 1.1s steps(2,end) infinite}
@keyframes b{50%{opacity:.2}}
.sway{transform-box:fill-box;transform-origin:50% 0;animation:sway 5.4s ease-in-out infinite}
@keyframes sway{0%,100%{transform:translate(-1.6px,0) rotate(-1.5deg)}30%{transform:translate(1.2px,-.6px) rotate(1deg)}55%{transform:translate(2px,.3px) rotate(1.7deg)}80%{transform:translate(-.6px,.4px) rotate(-.6deg)}}
}
</style>
