<text x="222.14" y="291.81" text-anchor="middle" font-size="14" font-weight="700" style="font-family:ui-monospace,Menlo,monospace" fill="#253126">></text>
<text x="222.14" y="314.81" text-anchor="middle" font-size="11" fill="#98a595">Line</text></g>
