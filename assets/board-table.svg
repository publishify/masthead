<text x="141.7" y="248.37" text-anchor="middle" font-size="14" font-weight="700" style="font-family:ui-monospace,Menlo,monospace" fill="#253126">></text>
<text x="141.7" y="271.37" text-anchor="middle" font-size="11" fill="#98a595">Academic</text></g>
<g class="sway" style="animation-duration:5.5s;animation-delay:-3.57s">
<rect x="434.86" y="270.81" width="46" height="30" rx="3" fill="#0a0f0b" stroke="#98a595" stroke-width="1.1"/>
<text x="457.86" y="291.81" text-anchor="middle" font-size="14" font-weight="700" style="font-family:ui-monospace,Menlo,monospace" fill="#98a595">></text>
<text x="457.86" y="314.81" text-anchor="middle" font-size="11" fill="#eef2ec">Evidence</text></g>
<g class="sway" style="animation-duration:5.85s;animation-delay:-1.88s">
